[project]
name = "verisense-backend"
version = "0.1.0"
description = "AICTE VeriSense backend - AI-assisted validation, document authentication and compliance verification (SIH 2026 prototype)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "reportlab>=4.1",
    "httpx>=0.27",
    # document AI pipeline (used by app/pipeline, app/adapters)
    "pymupdf>=1.24,<2",
    "opencv-python-headless>=4.9",
    "pillow>=10.2",
    "imagehash>=4.3",
    "rapidocr-onnxruntime>=1.3",
    "cryptography>=42",
    "numpy>=1.26,<2.3",
    "piexif>=1.1",
    "exifread>=3.0",
    "segno>=1.6.6",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
